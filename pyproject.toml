[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elixir"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "falcon~=4.0.2",
    "jinja2~=3.1.5",
    "pygments~=2.18.0",
    # DuckDB storage layer (elixir/data_duckdb.py); file format is not
    # stable across releases, keep pinned
    # NOTE keep in sync with wheel version in the Dockerfile
    "duckdb~=1.5.5",
    "pyarrow~=25.0.1",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "ruff~=0.14.14",
    "vulture~=2.16",
]

[project.scripts]
elixir = "elixir.cli:main"

[tool.setuptools]
# Flat layout: templates/ and static/ stay outside the package
# (elixir/web.py resolves them via CURRENT_DIR). Subpackages listed
# by hand so a built wheel carries them all.
packages = [
    "elixir",
    "elixir.filters",
    "elixir.lexers",
    "elixir.lexers.tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A practical core: pycodestyle (E/W), pyflakes (F, catches unused
# imports/variables), isort (I), bugbear (B, real hazards), pyupgrade
# (UP), comprehensions (C4).
select = ["E", "W", "F", "I", "B", "UP", "C4"]
ignore = [
    # Ported codebase: long SQL/regex/comment lines and printf-style
    # formatting are the inherited idiom; adopting the formatter and
    # f-strings wholesale is a separate, diff-noisy task
    "E501",
    "UP031",
    # Named lambdas: the ported style, harmless
    "E731",
    # typing.List -> list churn without value here
    "UP006",
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
# The harness scripts set up sys.path before they can import the tree
"t/equiv/*.py" = ["E402"]
"t/*" = ["E402"]
# vulture whitelist: bare names are vulture's documented whitelist
# style - undefined on purpose, read by vulture as references
"t/lint_vulture_whitelist.py" = ["B018", "F821"]
# Lexer test inputs embed significant trailing whitespace and
# whitespace-only lines: raw lexing data, not formatting
"elixir/lexers/tests/test_c.py" = ["W291"]
"elixir/lexers/tests/test_kconfig.py" = ["W293"]
